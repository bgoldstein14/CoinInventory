name: Idea or feature request
description: Suggest something Coin Inventory should do.
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        Describe the situation rather than the solution — it is often possible
        to solve the problem a different and simpler way.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: What would you like to happen?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
