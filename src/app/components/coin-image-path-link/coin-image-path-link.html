<!--
  One photo's original-file path. An existing file is a real <a>; a missing or
  unchecked one is a <span>, so it is not focusable or announced as a link.
  Renders nothing when no path was recorded.
-->
@if (view().hasPath) {
  @if (view().isLink) {
    <a
      class="image-path image-path--present"
      [href]="view().fileUrl"
      [title]="view().title"
      target="_blank"
      rel="noopener"
    >{{ view().displayPath }}</a>
  } @else {
    <!-- Missing or unknown: the path stays readable, only clickability and colour change. -->
    <span
      class="image-path"
      [class.image-path--missing]="view().existence === 'missing'"
      [class.image-path--unknown]="view().existence === 'unknown'"
      [title]="view().title"
    >{{ view().displayPath }}</span>
  }
}
