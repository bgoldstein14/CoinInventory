<aside class="panel detail-panel">
  <!-- Header: Show images on the left, the close × in the top-right corner. -->
  <div class="detail-header">
    <!-- Enabled even with no photos, because the gallery is also where photos are added. -->
    <button type="button" class="secondary small-button" [disabled]="!images().canOpenImageGallery(coin())" (click)="images().toggleImageGallery()">
      {{ images().showImageGallery() ? 'Hide images' : 'Show images' }}
    </button>
    <button type="button" class="detail-close" aria-label="Close" title="Close" (click)="closeRequested.emit()">&times;</button>
  </div>

  <!-- Draft note: polite status while typing; an alert only when the server refused a save. -->
  @if (draftStatus(); as draft) {
    <p
      class="detail-draft-note"
      [class.detail-draft-note--failed]="draft.failed"
      [attr.role]="draft.failed ? 'alert' : 'status'"
    >{{ draft.summary }}</p>
  }

  <!-- Editable fields. The Transactions section renders inside the form, above Notes. -->
  <app-coin-editor-form [coin]="coin()" [showTransactions]="showTransactions()" />

  <!-- Delete sits bottom-left, away from the close × in the top-right corner. -->
  <div class="detail-footer">
    <button type="button" class="danger small-button" (click)="deleteRequested.emit()">Delete</button>
  </div>

</aside>
