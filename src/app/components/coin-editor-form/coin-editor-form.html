<div class="detail-editor">
  <!-- Row 1: Year, Coin Type, Denomination, Mint mark. Widths are set on .detail-editor__row--top. -->
  <div class="detail-editor__row detail-editor__row--top">
    <!-- (ngModelChange) saves per keystroke; (change) fires on blur and re-runs the metal/weight autofill.
         Two-line textareas so text like "155-135 BC" wraps; Enter doesn't add a line break. -->
    <label class="detail-field detail-field--year">
      <span>Year</span>
      <textarea
        rows="2"
        [ngModel]="coin().year ?? ''"
        (ngModelChange)="updateSelectedCoin('year', singleLine($event))"
        (keydown.enter)="$event.preventDefault()"
        (change)="onKeyFieldCommitted('year')"
      ></textarea>
    </label>

    <label class="detail-field detail-field--coin-type">
      <span>Coin Type</span>
      <textarea
        rows="2"
        [ngModel]="coin().coinType"
        (ngModelChange)="updateSelectedCoin('coinType', singleLine($event))"
        (keydown.enter)="$event.preventDefault()"
        (change)="onKeyFieldCommitted('coinType')"
      ></textarea>
    </label>

    <!-- Denomination picker (see denomination-picker.ts). The search box only filters; it never writes to the coin. -->
    <label class="detail-field detail-field--denomination">
      <span>Denom.</span>
      <input
        class="detail-field__search"
        type="search"
        placeholder="Search…"
        aria-label="Search denominations"
        [ngModel]="denominationQuery()"
        (ngModelChange)="onDenominationSearch($event)"
      />
      <!-- A wrapping <label> names only its first control, so the select needs its own aria-label. -->
      <select
        aria-label="Denomination"
        [ngModel]="denominationMode.selectValue(denominationSelectValue())"
        (ngModelChange)="onDenominationSelected($event)"
      >
        <option value="">(select)</option>
        <!-- The coin's own denomination is always listed (a <select> with no matching option renders blank).
             Track by $index: keys can repeat and the list is rebuilt on every change. -->
        @for (group of denominationView().groups; track $index) {
          <optgroup [label]="group.heading">
            @for (option of group.options; track $index) {
              <option
                [value]="option.value"
                [title]="option.outOfCountry ? 'Already on this coin — does not match the country above' : ''"
              >{{ formatDenominationDisplay(option.label) }}{{ option.outOfCountry ? ' •' : '' }}</option>
            }
          </optgroup>
        }
        <!-- The sentinel only opens the custom box; it is never saved. -->
        <option [value]="CUSTOM_OPTION_SENTINEL">Other…</option>
      </select>
      <!-- Tell the user when the list fell back to everything or was capped. -->
      @if (denominationView().noMatches) {
        <small class="detail-field__note">No match for “{{ denominationView().query }}” — showing all</small>
      } @else if (denominationView().truncated) {
        <small class="detail-field__note">
          {{ denominationView().shownCount }} of {{ denominationView().matchCount }} — keep typing
        </small>
      }
    </label>

    <label class="detail-field detail-field--mint-mark">
      <span>Mint mark</span>
      <select
        [ngModel]="mintMarkMode.selectValue(coin().mintMark)"
        (ngModelChange)="onMintMarkSelected($event)"
      >
        <option value="">(none)</option>
        @for (mm of inv.mintMarks(); track mm.mintMarkId) {
          @if (mm.isActive) {
            <option [value]="mm.label" [title]="mm.description">{{ mm.label }}</option>
          }
        }
        <!-- "Other…" (with ellipsis) is distinct from the real mint mark labelled "Other". -->
        <option [value]="CUSTOM_OPTION_SENTINEL">Other…</option>
      </select>
    </label>
  </div>

  <!-- Custom "Other" boxes. Visibility follows the custom-mode signal, not the field value, so typing doesn't hide the box. -->
  @if (denominationMode.isCustom()) {
    <label class="detail-field detail-field--full">
      <span>Custom denomination</span>
      <input
        [ngModel]="coin().denomination"
        (ngModelChange)="updateSelectedCoin('denomination', $event)"
        (change)="onKeyFieldCommitted('denomination')"
      />
      <small class="detail-field__note">Shows as {{ denominationDisplayText() }}</small>
    </label>
  }

  @if (mintMarkMode.isCustom()) {
    <label class="detail-field detail-field--full detail-field--custom-mint-mark">
      <span>Custom mint mark</span>
      <textarea
        rows="2"
        [ngModel]="coin().mintMark"
        (ngModelChange)="updateSelectedCoin('mintMark', singleLine($event))"
        (keydown.enter)="$event.preventDefault()"
      ></textarea>
    </label>
  }

  <!-- Grade line: certification company is read together with the grade ("PCGS MS64"). -->
  <div class="detail-editor__row detail-editor__row--grade">
    <label class="detail-field detail-field--compact detail-field--cert-company">
      <span>Certification Co.</span>
      <input
        maxlength="10"
        [ngModel]="coin().certCompany"
        (ngModelChange)="updateSelectedCoin('certCompany', $event)"
      />
    </label>

    <div class="detail-field detail-field--grade-wrap">
      <span>Grade</span>
      <div class="detail-grade-line">
        <input
          [ngModel]="coin().grade"
          (ngModelChange)="onGradeChanged($event)"
        />
        <!-- CAC only applies to a graded coin. -->
        <label class="cac-inline-toggle" [class.cac-inline-toggle--disabled]="!hasGrade(coin().grade)"
          [title]="hasGrade(coin().grade) ? '' : 'Enter a grade first'">
          <input type="checkbox" [checked]="coin().hasCacSticker ?? false" [disabled]="!hasGrade(coin().grade)" (change)="toggleCacSticker()" />
          <span>CAC</span>
        </label>
      </div>
    </div>
  </div>

  <div class="detail-editor__row">
    <label class="detail-field">
      <span>Variety</span>
      <input [ngModel]="coin().variety" (ngModelChange)="updateSelectedCoin('variety', $event)" />
    </label>
    <!-- Free text with suggestions: existing values can be anything, and a <select> would show unknown ones as blank.
         The country also narrows the Denomination list (services/coin-countries.ts). -->
    <label class="detail-field">
      <span>Country</span>
      <input
        [ngModel]="coin().country"
        (ngModelChange)="updateSelectedCoin('country', $event)"
        (change)="onKeyFieldCommitted('country')"
        list="coin-country-suggestions"
      />
      <datalist id="coin-country-suggestions">
        @for (name of countrySuggestions; track name) {
          <option [value]="name"></option>
        }
      </datalist>
    </label>
  </div>

  <div class="detail-editor__row">
    <label class="detail-field">
      <span>Category</span>
      <select [ngModel]="coin().category" (ngModelChange)="updateSelectedCoin('category', $event)">
        <option value="">(none)</option>
        @for (category of inv.categoryOptions(); track category) { <option [value]="category">{{ category }}</option> }
      </select>
    </label>
    <label class="detail-field">
      <span>Set / Album</span>
      <select [ngModel]="coin().coinSet ?? ''" (ngModelChange)="updateSelectedCoin('coinSet', $event)">
        <option value="">(none)</option>
        @for (s of inv.coinSets(); track s) { <option [value]="s">{{ s }}</option> }
      </select>
    </label>
  </div>

  <!-- Status has no "(none)" option: an absent status means "owned". -->
  <div class="detail-editor__row">
    <label class="detail-field">
      <span>Status</span>
      <select
        [ngModel]="statusForSelect()"
        (ngModelChange)="updateSelectedCoin('collectionStatus', $event)"
      >
        @for (option of collectionStatusOptions; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </label>
    <label class="detail-field">
      <span>Storage location</span>
      <input
        type="text"
        maxlength="200"
        placeholder="e.g. Safe deposit box 2, Dansco 7070 p.4"
        [ngModel]="coin().storageLocation ?? ''"
        (ngModelChange)="updateSelectedCoin('storageLocation', $event)"
      />
    </label>
  </div>

  <div class="detail-editor__row detail-editor__row--metadata">
    <label class="detail-field detail-field--compact">
      <span>Metal</span>
      <!-- Metal can decide the reference lookup, so selecting it re-runs the metal/weight fill. -->
      <select [ngModel]="coin().metalContent ?? ''" (ngModelChange)="onMetalContentSelected($event)">
        <option value="">(none)</option>
        @for (m of metalContentOptions(); track m) { <option [value]="m">{{ m }}</option> }
      </select>
    </label>
    <label class="detail-field detail-field--composition">
      <span>Composition</span>
      <!-- Composition feeds the autofill; the fill never overwrites it (see pm-autofill.ts). -->
      <input
        [ngModel]="coin().composition"
        (ngModelChange)="updateSelectedCoin('composition', $event)"
        (change)="onKeyFieldCommitted('composition')"
      />
    </label>
  </div>

  <!-- appNumericField reformats only on blur, so the caret is not moved while typing. -->
  <div class="detail-editor__row detail-editor__row--bottom-metrics">
    <label class="detail-field detail-field--weight">
      <span>Weight (g)</span>
      <!-- Gross weight in grams; 5 decimals to match the DECIMAL(12,5) column. Melt uses PM Weight. -->
      <input
        [appNumericField]="coin().weight ?? 0"
        [decimals]="5"
        (numericValueChange)="updateNumericField('weight', $event)"
      />
    </label>
    <label class="detail-field detail-field--pm-weight">
      <span>PM Weight (g)</span>
      <input
        [appNumericField]="coin().pmWeightGrams ?? 0"
        [decimals]="5"
        (numericValueChange)="updateNumericField('pmWeightGrams', $event)"
      />
    </label>
    <label class="detail-field detail-field--pm-percent">
      <span>PM %</span>
      <input
        [appNumericField]="coin().pmPercent ?? 0"
        [decimals]="2"
        (numericValueChange)="updateNumericField('pmPercent', $event)"
      />
    </label>
  </div>

  <div class="detail-editor__row detail-editor__row--pricing">
    <label class="detail-field detail-field--compact detail-field--cert-number">
      <span>Cert. Number</span>
      <input
        [ngModel]="coin().certNumber"
        (ngModelChange)="updateSelectedCoin('certNumber', $event)"
      />
    </label>
    <label class="detail-field detail-field--money">
      <span>Value</span>
      <input
        [appNumericField]="coin().currentValue"
        [decimals]="2"
        prefix="$"
        [group]="true"
        (numericValueChange)="updateNumericField('currentValue', $event)"
      />
    </label>
    <!-- Read-only melt value from PM Weight and spot price; shows "—" when it cannot be worked out. -->
    <div class="detail-field detail-field--money detail-field--readonly" [title]="meltValueHint()">
      <span>Melt</span>
      <output class="readonly-value">{{ meltValueDisplay() }}</output>
    </div>
  </div>

  <!-- Catalogue references (e.g. "Sear 6819"); the grid shows Sear first. -->
  <fieldset class="detail-catalog-refs">
    <legend>Catalogue references</legend>
    @for (ref of catalogRefs(); track $index) {
      <div class="detail-catalog-refs__row">
        <!-- Active catalogues only, plus this row's own catalogue if it was removed. -->
        <select
          class="detail-catalog-refs__catalog"
          aria-label="Catalogue"
          [ngModel]="catalogIdForSelect(ref)"
          (ngModelChange)="updateCatalogRef($index, { catalogId: $event })"
        >
          <option value="">(none)</option>
          @for (option of catalogOptionsFor(ref); track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
        <input
          type="text"
          class="detail-catalog-refs__number"
          aria-label="Catalogue number"
          [attr.maxlength]="CATALOG_NUMBER_MAX_LENGTH"
          placeholder="6819"
          [ngModel]="ref.catalogNumber"
          (ngModelChange)="updateCatalogRef($index, { catalogNumber: $event })"
        />
        <button type="button" class="secondary detail-catalog-refs__remove"
          aria-label="Remove reference" (click)="removeCatalogRef($index)">&times;</button>
      </div>
    }
    <button type="button" class="secondary small-button" (click)="addCatalogRef()">Add reference</button>
  </fieldset>
</div>

<!-- Transactions section (optional, from Settings). Kept above the coin's notes; the two notes
     boxes are deliberately captioned, sized and styled differently. -->
@if (showTransactions()) {
  <section class="detail-transactions" aria-labelledby="coin-transaction-heading">
    <h3 id="coin-transaction-heading">Transactions</h3>
    <p class="detail-transactions__intro">
      The deal, not the coin: what it cost, what it sold for, and who with.
    </p>

    <div class="detail-transactions__row">
      <label class="detail-field detail-field--money">
        <span>Cost</span>
        <input
          [appNumericField]="coin().purchasePrice"
          [decimals]="2"
          prefix="$"
          [group]="true"
          (numericValueChange)="updateNumericField('purchasePrice', $event)"
        />
      </label>
      <label class="detail-field">
        <span>Purchase Date</span>
        <input
          type="date"
          [ngModel]="coin().purchaseDate"
          (ngModelChange)="updateSelectedCoin('purchaseDate', $event)"
        />
      </label>
      <label class="detail-field detail-field--party">
        <span>Purchased from</span>
        <input
          type="text"
          maxlength="200"
          placeholder="e.g. Heritage, eBay, a show"
          [ngModel]="coin().purchasedFrom ?? ''"
          (ngModelChange)="updateSelectedCoin('purchasedFrom', $event)"
        />
      </label>
    </div>

    <div class="detail-transactions__row">
      <label class="detail-field detail-field--money">
        <span>Sold for</span>
        <input
          [appNumericField]="coin().soldPrice"
          [decimals]="2"
          prefix="$"
          [group]="true"
          (numericValueChange)="updateNumericField('soldPrice', $event)"
        />
      </label>
      <label class="detail-field">
        <span>Sold Date</span>
        <input
          type="date"
          [ngModel]="coin().soldDate ?? ''"
          (ngModelChange)="updateSelectedCoin('soldDate', $event)"
        />
      </label>
      <label class="detail-field detail-field--party">
        <span>Sold to</span>
        <input
          type="text"
          maxlength="200"
          placeholder="e.g. a dealer, an auction, a collector"
          [ngModel]="coin().soldTo ?? ''"
          (ngModelChange)="updateSelectedCoin('soldTo', $event)"
        />
      </label>
    </div>

    <label class="detail-transaction-notes">
      <span class="detail-transaction-notes-label">Notes about this purchase or sale</span>
      <small class="detail-transaction-notes-hint">
        Terms, premiums, instalments, who was involved — anything about the deal.
      </small>
      <textarea
        [ngModel]="coin().transactionNotes ?? ''"
        (ngModelChange)="updateSelectedCoin('transactionNotes', $event)"
      ></textarea>
    </label>
  </section>
}

<!-- The coin's own notes. -->
<div class="detail-notes">
  <label>
    <span class="detail-notes-label">Notes about the coin itself</span>
    <small class="detail-notes-hint">Strike, toning, provenance, where it sits in the collection.</small>
    <textarea [ngModel]="coin().notes" (ngModelChange)="updateSelectedCoin('notes', $event)"></textarea>
  </label>
</div>
