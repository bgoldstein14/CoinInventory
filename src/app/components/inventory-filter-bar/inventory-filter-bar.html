<div class="toolbar">
  <input
    type="search"
    class="toolbar-search"
    placeholder="Search coins&hellip;"
    [ngModel]="filters().searchQuery()"
    (ngModelChange)="searchQueryChange.emit($event)"
    aria-label="Search inventory"
  />

  <select
    class="toolbar-filter"
    [ngModel]="filters().categoryFilter()"
    (ngModelChange)="categoryFilterChange.emit($event)"
    aria-label="Filter by category"
  >
    <option [value]="filters().allCategoriesFilter">All categories</option>
    @for (category of inv.inventoryCategories(); track category) {
      <option [value]="category">{{ category }}</option>
    }
  </select>

  <button type="button" class="secondary small-button" (click)="filters().toggleAdvancedFilters()">
    Filters {{ filters().showAdvancedFilters() ? '▲' : '▼' }}
  </button>

  <!-- The label says "Reference Data" but the output is
       `manageCategoriesRequested`: the dialog maintains six reference types,
       of which categories are only the first. The names differ on purpose —
       renaming the output would touch the shell and every test that drives
       it for no behavioural gain. -->
  <button type="button" class="secondary small-button" (click)="manageCategoriesRequested.emit()">Reference Data</button>
  <button type="button" class="secondary small-button" (click)="reportsRequested.emit()">Reports</button>
  <button type="button" class="secondary small-button" (click)="statisticsRequested.emit()">Statistics</button>
  <button type="button" class="secondary small-button" (click)="spotPricesRequested.emit()">Spot Prices</button>
</div>

@if (filters().showAdvancedFilters()) {
  <div class="advanced-filters">
    <div class="filter-group">
      <label>
        <span>Grade</span>
        <input type="text" placeholder="e.g. MS, VF, AU" [ngModel]="filters().gradeFilter()" (ngModelChange)="filters().gradeFilter.set($event)" />
      </label>
      <label>
        <span>Min value</span>
        <input type="number" step="0.01" placeholder="$0" [ngModel]="filters().valueMinFilter()" (ngModelChange)="filters().valueMinFilter.set($event)" />
      </label>
      <label>
        <span>Max value</span>
        <input type="number" step="0.01" placeholder="$∞" [ngModel]="filters().valueMaxFilter()" (ngModelChange)="filters().valueMaxFilter.set($event)" />
      </label>
      <label>
        <span>Country</span>
        <select [ngModel]="filters().countryFilter()" (ngModelChange)="filters().countryFilter.set($event)">
          <option value="">All countries</option>
          @for (c of inv.inventoryCountries(); track c) {
            <option [value]="c">{{ c }}</option>
          }
        </select>
      </label>
      <label>
        <span>Source</span>
        <select [ngModel]="filters().sourceFilter()" (ngModelChange)="filters().sourceFilter.set($event)">
          <option value="">All sources</option>
          @for (s of inv.inventorySources(); track s) {
            <option [value]="s">{{ s }}</option>
          }
        </select>
      </label>
      <!-- Collection status. Sits with the other closed-set dropdowns rather
           than in the always-visible toolbar row: narrowing to the want list
           is a deliberate act, not something to do by accident, and the
           toolbar has no room left. The options come from the store (which
           re-exports COLLECTION_STATUS_OPTIONS) so this list, the editor's
           dropdown and the grid can never offer different values. -->
      <label>
        <span>Status</span>
        <select [ngModel]="filters().collectionStatusFilter()" (ngModelChange)="filters().collectionStatusFilter.set($event)">
          <option value="">All statuses</option>
          @for (option of filters().collectionStatusOptions; track option.value) {
            <option [value]="option.value">{{ option.label }}</option>
          }
        </select>
      </label>
      <label>
        <span>Set</span>
        <select [ngModel]="filters().coinSetFilter()" (ngModelChange)="filters().coinSetFilter.set($event)">
          <option [value]="filters().allSetsFilter">All sets</option>
          @for (s of inv.coinSets(); track s) {
            <option [value]="s">{{ s }}</option>
          }
        </select>
      </label>
    </div>
  </div>
}
