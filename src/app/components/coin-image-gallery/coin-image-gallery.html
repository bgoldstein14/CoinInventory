<!--
  Clicking the dark backdrop closes the gallery; the $event.stopPropagation()
  on the panel itself stops a click *inside* the gallery from bubbling up and
  closing it too.
-->
<div class="modal-backdrop" (click)="images().closeImageGallery()">
  <div class="modal modal--wide image-gallery-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Images</h2>
      <button type="button" class="modal-close" (click)="images().closeImageGallery()" aria-label="Close images">&times;</button>
    </div>
    <div class="modal-body">
      <div class="image-gallery" (drop)="images().handleImageDrop($event)" (dragover)="images().handleDragOver($event)">
        <div class="image-gallery__header">
          <h3>Attached photos</h3>
          <label class="file-picker file-picker--compact">
            <input type="file" multiple (change)="images().addCoinImages($event)" />
            Add images
          </label>
        </div>
        <div class="image-list">
          @for (imagePath of coin().imagePaths; track imagePath; let i = $index) {
            <div class="image-item">
              <img [src]="imagePath" alt="Coin image" class="coin-thumb" (click)="images().openPhotoViewer(i)" />
              <div class="image-item__meta">
                <span class="image-item__label">{{ imagePath.includes('data:') ? 'Attached image' : imagePath }}</span>
                <!--
                  Where the ORIGINAL full-size file lives. `imagePath` above is
                  only the downscaled copy we store in the database; this is the
                  real photo on disk, clickable when it is still there and shown
                  greyed out (but still readable) when it is not. Renders nothing
                  when no path was ever recorded.
                -->
                <app-coin-image-path-link [imageData]="imagePath" [coinId]="coin().id" />
              </div>
              <button type="button" class="secondary small-button" (click)="images().removeCoinImage(imagePath)">Delete</button>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
